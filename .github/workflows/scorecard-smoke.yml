name: Scorecard smoke

# Runs scripts/scorecard on GitHub-hosted runners: a weekly trend of nesso
# against the competitors, and a check that the pipeline still works on real
# Linux (the per-run memory cap and the out-of-memory outcome, every competitor
# install from a clean machine, and install -> run -> merge). Everything here
# is development-only: hosted runners are shared and too noisy to publish
# timings from, so the scorecard marks the results with --dev.
#
# nesso main is the amd64 .deb (repro-deb-amd64-a) from the latest successful
# scheduled Package run on lorenzocaprari/nesso main, or the run given as
# nesso_run_id; the nesso-main job finds that run, records its id and head SHA,
# and hands the .deb on. Artifacts there expire after 14 days, so an older run
# fails that job. The nesso job then scores, on one runner, the released
# baseline (nesso_version, default 0.3.1) with the keyword engines ripgrep,
# bm25, opensearch, and xerj, and nesso main. Every embedding engine group runs
# in its own job on the small suites (and xerj-semantic on the 100k BGL needle
# window too) at one repeat.
#
# The summary compares quality margins (deterministic) with the previous
# scheduled run kept in this repo and with the release scored in this run.
# In-job engines are ratios against nesso, grep, and ripgrep on that one
# runner. Embedding engines are a per-engine trend, shown only after four kept
# runs, never as a comparison across jobs. The timing report is committed to
# the results/ci-smoke branch by the record job, which is the only job with
# contents: write. It creates the branch if missing, appends, and never
# force-pushes. It does not open a pull request: Actions cannot approve one
# here. The maintainer merges that branch by hand. No secret is added.
# Artifacts still expire.
#
# Weekly on Sunday (16:23 UTC, clear of nesso's nightly crons) and on
# workflow_dispatch, including a release candidate. A full run takes about two
# hours, so it never runs on pull requests. To check a change to this workflow,
# run it on the branch with `gh workflow run scorecard-smoke.yml --ref <branch>`
# (add `-f nesso_version=X.Y.Z` or `-f nesso_run_id=N` to pick other builds).
on:
  schedule:
    - cron: "23 16 * * 0"
  workflow_dispatch:
    inputs:
      nesso_version:
        description: Released nesso baseline to score (a version pinned in scripts/install-nesso)
        required: true
        default: "0.3.1"
        type: string
      nesso_run_id:
        description: nesso Package run whose amd64 .deb is scored as main (empty = latest successful scheduled run on main)
        required: false
        default: ""
        type: string

concurrency:
  group: scorecard-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONHASHSEED: "0"
  # A scheduled run has no inputs; it scores the defaults.
  NESSO_VERSION: ${{ inputs.nesso_version || '0.3.1' }}

jobs:
  # Nothing else runs until a memory cap is known to work: an engine that cannot
  # be capped would run uncapped and could take the runner down.
  memory-cap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The check prints what it found (kernel, cgroup controllers, user manager)
      # whether or not it passes, and fails with an explanation when the cap does
      # not work even after enabling lingering for the runner user.
      - name: Check the memory cap
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-memory-cap 2>&1 | tee "${RUNNER_TEMP}/memory-cap.txt"

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### Memory cap"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/memory-cap.txt" 2>/dev/null || echo "no output"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # Finds the nesso build to score as main: the latest successful scheduled
  # Package run on nesso main (or nesso_run_id), and hands its amd64 .deb to the
  # score-nesso job. nesso is a public repository, so this job's own token can
  # read its runs and artifacts; it needs nothing else.
  nesso-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      run_url: ${{ steps.find.outputs.run_url }}
      head_sha: ${{ steps.find.outputs.head_sha }}
      version: ${{ steps.unpack.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      NESSO_REPO: lorenzocaprari/nesso
      NESSO_RUN_ID: ${{ inputs.nesso_run_id }}
      # The Package workflow's amd64 .deb; it ships /usr/bin/nesso and
      # /usr/share/nesso/{model.onnx,vocab.txt}.
      NESSO_ARTIFACT: repro-deb-amd64-a
      # The Package workflow keeps its artifacts this long.
      MAX_AGE_DAYS: "14"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Find the nesso Package run
        id: find
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NESSO_RUN_ID}" ]]; then
            [[ "${NESSO_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "::error::nesso_run_id must be a run id (digits only)"; exit 1; }
            run="$(gh api "repos/${NESSO_REPO}/actions/runs/${NESSO_RUN_ID}")"
            path="$(jq -r '.path' <<<"${run}")"
            [[ "${path}" == ".github/workflows/package.yml" ]] || { echo "::error::run ${NESSO_RUN_ID} is ${path}, not the Package workflow"; exit 1; }
            conclusion="$(jq -r '.conclusion' <<<"${run}")"
            [[ "${conclusion}" == "success" ]] || { echo "::error::Package run ${NESSO_RUN_ID} concluded ${conclusion}, not success"; exit 1; }
          else
            run="$(gh api "repos/${NESSO_REPO}/actions/workflows/package.yml/runs?branch=main&event=schedule&status=success&per_page=1" --jq '.workflow_runs[0] // empty')"
            [[ -n "${run}" ]] || { echo "::error::no successful scheduled Package run on ${NESSO_REPO} main"; exit 1; }
          fi
          id="$(jq -r '.id' <<<"${run}")"
          created="$(jq -r '.created_at' <<<"${run}")"
          age_days=$(( ( $(date -u +%s) - $(date -u -d "${created}" +%s) ) / 86400 ))
          if (( age_days >= MAX_AGE_DAYS )); then
            echo "::error::the Package run to score (${id}, ${created}) is ${age_days} days old; its artifacts expire after ${MAX_AGE_DAYS} days. No successful scheduled Package run on main in the last ${MAX_AGE_DAYS} days."
            exit 1
          fi
          artifact="$(gh api "repos/${NESSO_REPO}/actions/runs/${id}/artifacts?name=${NESSO_ARTIFACT}" --jq '.artifacts[0] // empty')"
          [[ -n "${artifact}" ]] || { echo "::error::Package run ${id} has no ${NESSO_ARTIFACT} artifact"; exit 1; }
          [[ "$(jq -r '.expired' <<<"${artifact}")" == "false" ]] || { echo "::error::${NESSO_ARTIFACT} of Package run ${id} has expired"; exit 1; }
          mkdir -p "${RUNNER_TEMP}/nesso-main"
          jq '{repository: .repository.full_name, runId: .id, runUrl: .html_url, event: .event, headBranch: .head_branch, headSha: .head_sha, createdAt: .created_at, artifact: env.NESSO_ARTIFACT}' \
            <<<"${run}" > "${RUNNER_TEMP}/nesso-main/nesso-package.json"
          {
            echo "run_id=${id}"
            echo "run_url=$(jq -r '.html_url' <<<"${run}")"
            echo "head_sha=$(jq -r '.head_sha' <<<"${run}")"
          } >> "${GITHUB_OUTPUT}"
          cat "${RUNNER_TEMP}/nesso-main/nesso-package.json"

      # Cross-repository download with this job's token: nesso is public.
      - name: Download the nesso .deb
        shell: bash
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "${RUN_ID}" -R "${NESSO_REPO}" -n "${NESSO_ARTIFACT}" -D "${RUNNER_TEMP}/nesso-main/deb"

      # Unpacked, not installed: the scorecard takes the binary and model directory.
      - name: Check the .deb
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/nesso-main"
          shopt -s nullglob
          debs=("${dir}"/deb/*.deb)
          [[ ${#debs[@]} -eq 1 ]] || { echo "::error::expected one .deb in ${NESSO_ARTIFACT}, found ${#debs[@]}"; exit 1; }
          dpkg-deb -x "${debs[0]}" "${dir}/root"
          for file in usr/bin/nesso usr/share/nesso/model.onnx usr/share/nesso/vocab.txt; do
            [[ -f "${dir}/root/${file}" ]] || { echo "::error::the .deb has no /${file}"; exit 1; }
          done
          version="$("${dir}/root/usr/bin/nesso" -V | head -n 1)"
          sha256="$(sha256sum "${debs[0]}" | cut -d' ' -f1)"
          jq --arg deb "$(basename "${debs[0]}")" --arg sha256 "${sha256}" --arg version "${version}" \
            '. + {deb: $deb, debSha256: $sha256, versionOutput: $version}' "${dir}/nesso-package.json" > "${dir}/deb/nesso-package.json"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          cat "${dir}/deb/nesso-package.json"

      - name: Upload the .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nesso-main-deb
          path: ${{ runner.temp }}/nesso-main/deb/
          retention-days: 14
          if-no-files-found: error

  # nesso main and the released baseline, and the keyword engines, in one job:
  # timings from different runners do not compare, so this is where the ratios
  # in the summary come from. About 65 minutes on the 21 Nov 2026 smoke wall
  # times (nesso about 21 minutes per build on these suites, opensearch about
  # 10, ripgrep, bm25, and xerj under a minute), plus installs and fetches.
  score-nesso:
    name: score (nesso main, nesso baseline, keyword engines)
    needs: [memory-cap, nesso-main]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      SUITES: 2k,formats,json,bundle,bgl-needle-100k
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${NESSO_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: nesso_version must look like 0.3.1" >&2; exit 1; }

      - name: Install GNU time
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq time

      - name: Check the memory cap
        shell: bash
        run: bash scripts/check-memory-cap --env-file "${GITHUB_ENV}"

      # Results go outside the checkout, so the second scorecard run does not
      # see the first one's results as local changes.
      - name: Set the paths
        shell: bash
        run: |
          {
            echo "BASELINE_OUT=${RUNNER_TEMP}/scorecard/nesso-baseline"
            echo "MAIN_OUT=${RUNNER_TEMP}/scorecard/nesso-main"
            echo "MAIN_DIR=${RUNNER_TEMP}/nesso-main"
          } >> "${GITHUB_ENV}"

      - name: Download the nesso main .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nesso-main-deb
          path: ${{ runner.temp }}/nesso-main

      - name: Unpack the nesso main .deb
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=("${MAIN_DIR}"/*.deb)
          [[ ${#debs[@]} -eq 1 ]] || { echo "::error::expected one .deb, found ${#debs[@]}"; exit 1; }
          dpkg-deb -x "${debs[0]}" "${MAIN_DIR}/root"
          "${MAIN_DIR}/root/usr/bin/nesso" -V

      - name: Run the scorecard on the baseline and the keyword engines
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/scorecard --nesso-version "${NESSO_VERSION}" --dev --repeat 1 \
            --memory-max 12G --suites "${SUITES}" --groups nesso,ripgrep,bm25,opensearch,xerj \
            --out "${BASELINE_OUT}"

      - name: Run the scorecard on nesso main
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/scorecard --nesso-binary "${MAIN_DIR}/root/usr/bin/nesso" \
            --nesso-model-dir "${MAIN_DIR}/root/usr/share/nesso" --dev --repeat 1 \
            --memory-max 12G --suites "${SUITES}" --groups nesso --out "${MAIN_OUT}"
          cp "${MAIN_DIR}/nesso-package.json" "${MAIN_OUT}/nesso-package.json"

      - name: Summarize
        if: always()
        shell: bash
        run: |
          python3 scripts/scorecard-status "${MAIN_OUT}" "${BASELINE_OUT}" >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Upload the baseline results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-smoke-nesso-baseline
          path: ${{ env.BASELINE_OUT }}/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the main results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-smoke-nesso-main
          path: ${{ env.MAIN_OUT }}/
          retention-days: 14
          if-no-files-found: warn

  score:
    name: score (${{ matrix.group }})
    needs: [memory-cap]
    # Host runner, not the build container: OpenSearch refuses to run as root.
    # ubuntu-24.04 ships Python 3.12, the version diy-faiss.hashes.txt targets.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # nesso and the keyword engines run in the score-nesso job, on one runner.
          - group: xerj-semantic
            suites: 2k,formats,json,bundle,bgl-needle-100k
          # The other embedding engines take 1 to 2 hours on the 100k window at
          # one repeat, and ck and vecgrep exhaust the 16 GB runner there (the oom
          # job below runs vecgrep on purpose under a small cap).
          - group: diy-faiss
            suites: 2k,formats,json,bundle
          - group: opensearch-knn
            suites: 2k,formats,json,bundle
          - group: xerj-neural
            suites: 2k,formats,json,bundle
          - group: ck
            suites: 2k,formats,json,bundle
          - group: vecgrep
            suites: 2k,formats,json,bundle
    env:
      GROUP: ${{ matrix.group }}
      SUITES: ${{ matrix.suites }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${NESSO_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: nesso_version must look like 0.3.1" >&2; exit 1; }

      # The scorecard measures with GNU time (/usr/bin/time).
      - name: Install GNU time
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq time

      # Re-checks the cap in this job and, when it needed the user manager
      # started, passes XDG_RUNTIME_DIR to the steps below.
      - name: Check the memory cap
        shell: bash
        run: bash scripts/check-memory-cap --env-file "${GITHUB_ENV}"

      # The scorecard installs nesso and this group's competitor, fetches or builds
      # every input, runs each suite under a memory cap and a timeout, and merges.
      # A run that did not finish is a finding recorded in status.json, not an
      # error, so this step fails only when the setup itself breaks.
      - name: Run the scorecard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/scorecard --nesso-version "${NESSO_VERSION}" --dev --repeat 1 \
            --memory-max 12G --suites "${SUITES}" --groups "${GROUP}"

      - name: Summarize
        if: always()
        shell: bash
        run: |
          python3 scripts/scorecard-status "results/${NESSO_VERSION}" >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-smoke-${{ matrix.group }}
          path: results/${{ env.NESSO_VERSION }}/
          retention-days: 14
          if-no-files-found: warn

  # An engine that cannot finish under its cap must be recorded as that result.
  # vecgrep's chunk index exhausts a 16 GB runner on the 100k window, so under a
  # 3 GB cap it is killed; the scorecard has to say so and carry on.
  oom:
    needs: [memory-cap]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${NESSO_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: nesso_version must look like 0.3.1" >&2; exit 1; }

      - name: Install GNU time
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq time

      - name: Check the memory cap
        shell: bash
        run: bash scripts/check-memory-cap --env-file "${GITHUB_ENV}"

      - name: Run vecgrep under a 3 GB cap
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/scorecard --nesso-version "${NESSO_VERSION}" --dev --repeat 1 \
            --memory-max 3G --suites bgl-needle-100k --groups vecgrep

      - name: Check that the out-of-memory run was recorded
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          status = json.load(open(f"results/{os.environ['NESSO_VERSION']}/status.json"))
          outcomes = [run["outcome"] for run in status["runs"]]
          print("outcomes:", outcomes)
          assert outcomes == ["out-of-memory (3G)"], f"expected one out-of-memory (3G) run, got {outcomes}"
          PY

      - name: Summarize
        if: always()
        shell: bash
        run: |
          python3 scripts/scorecard-status "results/${NESSO_VERSION}" >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-smoke-oom
          path: results/${{ env.NESSO_VERSION }}/
          retention-days: 14
          if-no-files-found: warn

  summary:
    needs: [memory-cap, nesso-main, score-nesso, score, oom]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scorecard-smoke-*
          path: smoke

      # Outcomes only. Wall times from different jobs are not a comparison.
      - name: Summarize every group
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(smoke/*/)
          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "No results were uploaded." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python3 scripts/scorecard-status --no-times "${dirs[@]}" >> "${GITHUB_STEP_SUMMARY}"

      # Which nesso build was scored as main.
      - name: Name the nesso main build
        if: ${{ !cancelled() }}
        shell: bash
        env:
          RUN_ID: ${{ needs.nesso-main.outputs.run_id }}
          RUN_URL: ${{ needs.nesso-main.outputs.run_url }}
          HEAD_SHA: ${{ needs.nesso-main.outputs.head_sha }}
          MAIN_VERSION: ${{ needs.nesso-main.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### nesso main"
            echo
            if [[ -n "${RUN_ID}" ]]; then
              echo "nesso main is \`${MAIN_VERSION}\` from Package run [${RUN_ID}](${RUN_URL}) at \`${HEAD_SHA}\`, scored next to the ${NESSO_VERSION} release. \`nesso-package.json\` in \`scorecard-smoke-nesso-main\` records the same run."
            else
              echo "No nesso main build was found; see the nesso-main job."
            fi
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      # Quality of nesso main against the baseline, per suite, system, and class,
      # with the per-query paired intervals where the reports carry per-query
      # results. Both reports come from the nesso job (nesso and grep).
      - name: Compare nesso main with the baseline
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          main=smoke/scorecard-smoke-nesso-main
          baseline=smoke/scorecard-smoke-nesso-baseline
          {
            echo "### nesso main against ${NESSO_VERSION}: quality (development-only)"
            echo
            shopt -s nullglob
            reports=("${main}"/raw/*/nesso.json)
            if [[ ${#reports[@]} -eq 0 ]]; then
              echo "No nesso main reports were uploaded."
            fi
            for report in "${reports[@]}"; do
              suite="$(basename "$(dirname "${report}")")"
              previous="${baseline}/raw/${suite}/nesso.json"
              echo "#### ${suite}"
              echo
              if [[ ! -f "${previous}" ]]; then
                echo "No baseline report for this suite."
                echo
                continue
              fi
              if ! text="$(python3 scripts/eval-retrieval-compare --current "${report}" --previous "${previous}" 2>&1)"; then
                printf 'The comparison failed:\n\n```\n%s\n```\n\n' "${text}"
                continue
              fi
              drops="$(grep '^DROP ' <<<"${text}" || true)"
              if [[ -n "${drops}" ]]; then
                sed 's/^/- /' <<<"${drops}"
              else
                echo "No drop beyond the tolerance."
              fi
              echo
              echo "<details><summary>${suite}: every system, ranker, class, and metric</summary>"
              echo
              echo "${text}"
              echo
              echo "</details>"
              echo
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      # Quality margins against the previous scheduled run and the release, in-job
      # ratios, and embedding trends. The kept reports live on results/ci-smoke
      # (and on main, once that pull request is merged). Fetch is anonymous:
      # the branch is public and this job's token stays read-only.
      - name: Competitor trend
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          NESSO_MAIN_VERSION: ${{ needs.nesso-main.outputs.version }}
          NESSO_MAIN_RUN: ${{ needs.nesso-main.outputs.run_id }}
          NESSO_MAIN_URL: ${{ needs.nesso-main.outputs.run_url }}
          NESSO_MAIN_SHA: ${{ needs.nesso-main.outputs.head_sha }}
        run: |
          set -euo pipefail
          history="${RUNNER_TEMP}/trend-history"
          mkdir -p "${history}"
          if [[ -d results/ci-smoke ]]; then
            cp -a results/ci-smoke/. "${history}/"
          fi
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --heads "${remote}" refs/heads/results/ci-smoke | grep -q .; then
            git fetch --no-tags --depth=1 "${remote}" refs/heads/results/ci-smoke
            if git cat-file -e FETCH_HEAD:results/ci-smoke 2>/dev/null; then
              branch="${RUNNER_TEMP}/trend-branch"
              rm -rf "${branch}"
              mkdir -p "${branch}"
              git archive FETCH_HEAD results/ci-smoke | tar -x -C "${branch}"
              if [[ -d "${branch}/results/ci-smoke" ]]; then
                cp -a "${branch}/results/ci-smoke/." "${history}/"
              fi
            fi
          fi
          embeddings=()
          for group in diy-faiss opensearch-knn xerj-neural xerj-semantic ck vecgrep; do
            dir="smoke/scorecard-smoke-${group}"
            if [[ -d "${dir}" ]]; then
              embeddings+=(--embedding "${dir}")
            fi
          done
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "${RUNNER_TEMP}/trend-report"
          python3 scripts/scorecard-trend \
            --main smoke/scorecard-smoke-nesso-main \
            --release smoke/scorecard-smoke-nesso-baseline \
            "${embeddings[@]}" \
            --history "${history}" \
            --run-id "${RUN_ID}" \
            --run-url "${RUN_URL}" \
            --event "${EVENT_NAME}" \
            --created-at "${created}" \
            --head-sha "${HEAD_SHA}" \
            --nesso-release "${NESSO_VERSION}" \
            --nesso-main-version "${NESSO_MAIN_VERSION}" \
            --nesso-main-run "${NESSO_MAIN_RUN}" \
            --nesso-main-url "${NESSO_MAIN_URL}" \
            --nesso-main-sha "${NESSO_MAIN_SHA}" \
            --record "${RUNNER_TEMP}/trend-report" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the timing report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-smoke-trend
          path: ${{ runner.temp }}/trend-report/
          retention-days: 14
          if-no-files-found: error

  # Appends results/ci-smoke/<run-id>/ on the results/ci-smoke branch. This job
  # is the only one whose token can write, and it cannot open a pull request.
  # The maintainer merges the branch by hand. The identity is the Actions bot.
  record:
    name: keep the timing report
    needs: [summary]
    if: always() && !cancelled() && needs.summary.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the timing report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scorecard-smoke-trend
          path: trend-report

      - name: Commit the timing report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          work="${RUNNER_TEMP}/record"
          rm -rf "${work}"
          if git ls-remote --heads "${remote}" refs/heads/results/ci-smoke | grep -q .; then
            git clone --branch results/ci-smoke --single-branch --depth=20 "${remote}" "${work}"
          else
            git clone --branch main --single-branch --depth=1 "${remote}" "${work}"
            git -C "${work}" checkout -b results/ci-smoke
          fi
          git -C "${work}" config user.name "github-actions[bot]"
          git -C "${work}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dest="results/ci-smoke/${RUN_ID}"
          rm -rf "${work}/${dest}"
          mkdir -p "${work}/${dest}"
          cp -a trend-report/. "${work}/${dest}/"
          git -C "${work}" add "${dest}"
          if git -C "${work}" diff --cached --quiet; then
            echo "timing report for run ${RUN_ID} is already committed"
            exit 0
          fi
          git -C "${work}" commit -m "ci(bench): record scorecard smoke timings for run ${RUN_ID}"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          push() {
            git -C "${work}" -c "http.extraheader=AUTHORIZATION: basic ${auth}" push origin "HEAD:results/ci-smoke"
          }
          # A rejected push is retried once after a rebase. Never force-push.
          if ! push; then
            git -C "${work}" -c "http.extraheader=AUTHORIZATION: basic ${auth}" pull --rebase origin results/ci-smoke
            push
          fi
