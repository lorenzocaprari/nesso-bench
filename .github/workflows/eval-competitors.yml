name: Eval competitors

# Scores the heavy competitor engines (diy-faiss, OpenSearch BM25 and k-NN,
# ck, vecgrep, and xerj: BM25 match, neural, and its default semantic search)
# on the Loghub 2k seed sets and the bgl-needle-100k needle window, retrieval
# quality only: no --measure, because runner timings are too noisy to publish.
# Each engine runs in its own job; the merge job combines whatever finished
# into one 2k report and one needle report. The merged reports are the source
# for the committed reference in test/eval/reference/. Manual only
# (workflow_dispatch): a full run takes over an hour, so it never runs on pull
# requests. To check a change to this workflow, run it on the branch with
# `gh workflow run eval-competitors.yml --ref <branch>`. nesso is not built
# here; nesso's eval-retrieval workflow scores it on the same sets.
on:
  workflow_dispatch:

concurrency:
  group: eval-competitors-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONHASHSEED: "0"

jobs:
  # Fetch the Loghub inputs once, so the engine jobs do not all download the
  # Zenodo archive at the same time.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # fetch-loghub checks every pin; a bad download is retried, not trusted.
      - name: Fetch Loghub inputs
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 scripts/fetch-loghub --dataset all-2k \
              && python3 scripts/fetch-loghub --dataset bgl-loghub2 --window 4100001:100000; then
              exit 0
            fi
            echo "fetch attempt ${attempt} failed; retrying" >&2
            sleep 30
          done
          exit 1

      - name: Upload Loghub inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loghub-inputs
          path: build/bench/
          retention-days: 1
          if-no-files-found: error

  score:
    name: score (${{ matrix.engine }})
    needs: [prepare]
    # Host runner, not the build container: OpenSearch refuses to run as root.
    # ubuntu-24.04 ships Python 3.12, the version diy-faiss.hashes.txt targets.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [diy-faiss, opensearch, opensearch-knn, ck, vecgrep, xerj, xerj-neural, xerj-semantic]
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scripts/install-competitors holds the pins (see docs/eval.md) and checks
      # every download. It sets EVAL_PYTHON (diy-faiss and opensearch-knn),
      # OPENSEARCH_HOME, and XERJ_MODEL_DIR (xerj-neural), and puts ck,
      # vecgrep, and xerj on PATH, for the steps below.
      - name: Install ${{ matrix.engine }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-competitors --dest "${RUNNER_TEMP}/competitors" \
            --env-file "${GITHUB_ENV}" --path-file "${GITHUB_PATH}" "${ENGINE}" >/dev/null

      - name: Download Loghub inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loghub-inputs
          path: build/bench

      - name: Score the 2k seed sets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/eval/competitors
          extra=()
          if [[ -n "${XERJ_MODEL_DIR:-}" ]]; then
            extra+=(--xerj-model-dir "${XERJ_MODEL_DIR}")
          fi
          "${EVAL_PYTHON:-python3}" scripts/eval-retrieval \
            --dataset all-2k \
            --engine "${ENGINE}" \
            "${extra[@]}" \
            --skip-fetch \
            --out "build/eval/competitors/2k-${ENGINE}.json"

      # ck and vecgrep build multi-line chunk indexes that exhaust the 16 GB
      # hosted runner on the 100k needle window (the runner shuts down mid-
      # step), so they score the 2k seed sets only. The condition names them
      # explicitly: a matrix key that is absent for other engines compares equal
      # to false in an expression, which skipped this step for every engine.
      # The slowest engines take about 45 minutes (diy-faiss) and 75 minutes
      # (xerj-neural) on this step. The step timeout is about twice the slowest,
      # so a hang fails here instead of at the job timeout. The harness prints
      # one progress line per engine phase to stderr.
      - name: Score the BGL needle window
        if: matrix.engine != 'ck' && matrix.engine != 'vecgrep'
        timeout-minutes: 150
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "${XERJ_MODEL_DIR:-}" ]]; then
            extra+=(--xerj-model-dir "${XERJ_MODEL_DIR}")
          fi
          "${EVAL_PYTHON:-python3}" scripts/eval-retrieval \
            --dataset bgl-needle-100k \
            --engine "${ENGINE}" \
            "${extra[@]}" \
            --skip-fetch \
            --out "build/eval/competitors/needle-${ENGINE}.json"

      - name: Upload engine reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: competitors-${{ matrix.engine }}
          path: build/eval/competitors/
          retention-days: 7
          if-no-files-found: warn

  merge:
    needs: [score]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download engine reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: competitors-*
          path: build/eval/competitors
          merge-multiple: true

      # Engines that failed (for example out of memory) are simply absent.
      - name: Merge reports
        shell: bash
        run: |
          set -euo pipefail
          out=build/eval/merged
          mkdir -p "${out}"
          {
            echo "### Competitor scores (retrieval quality only)"
            echo
            echo "ck and vecgrep score the 2k seed sets only: their chunk indexes exhaust the hosted runner's memory on the 100k needle window."
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
          for kind in 2k needle; do
            shopt -s nullglob
            inputs=()
            for engine in diy-faiss opensearch opensearch-knn ck vecgrep xerj xerj-neural xerj-semantic; do
              file="build/eval/competitors/${kind}-${engine}.json"
              if [[ -f "${file}" ]]; then
                inputs+=("${file}")
              else
                echo "- ${kind}: no report from ${engine}" >> "${GITHUB_STEP_SUMMARY}"
              fi
            done
            if [[ ${#inputs[@]} -eq 0 ]]; then
              continue
            fi
            python3 scripts/eval-retrieval-merge "${inputs[@]}" \
              --out "${out}/competitors-${kind}.json" \
              --markdown "${out}/competitors-${kind}.md"
            { echo; cat "${out}/competitors-${kind}.md"; } >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Upload merged reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-competitors
          path: build/eval/merged/
          retention-days: 30
          if-no-files-found: warn
